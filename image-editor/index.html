<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Editor</title>
<style>
  :root {
    --bg: #0b0b0f; --stage: #0e0e12; --panel: #131318; --panel2: #1a1a20; --panel3: #222229;
    --line: #26262e; --line2: #32323b; --text: #f4f4f6; --muted: #8a8a96; --dim: #5b5b66;
    --accent: #facc15; --accent-ink: #141414; --accent-soft: rgba(250, 204, 21, .14);
    --violet: #8b5cf6; --danger: #f43f5e;
    --r: 10px; --top: 58px; --sub: 46px; --side: 304px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: var(--text); }
  svg { display: block; }

  /* ── top bar ── */
  .top { position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: stretch; gap: 4px; padding: 0 10px;
    background: linear-gradient(#17171d, #101014); border-bottom: 1px solid var(--line); z-index: 5; }
  .tb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 70px; padding: 0 10px;
    color: var(--muted); border-radius: 9px; margin: 6px 0; position: relative; transition: color .15s, background .15s; }
  .tb svg { width: 20px; height: 20px; }
  .tb span { font-size: 11.5px; font-weight: 500; }
  .tb:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
  .tb.on { color: var(--text); background: linear-gradient(180deg, rgba(250, 204, 21, .16), rgba(250, 204, 21, .04)); box-shadow: inset 0 0 0 1px rgba(250, 204, 21, .28); }
  .tb.on svg { color: var(--accent); }
  .tb:disabled { opacity: .35; cursor: default; background: none; }
  .tb.menu { min-width: 62px; }
  .cats { display: flex; gap: 2px; margin: 0 auto; }
  .tright { display: flex; gap: 2px; }
  .sep { width: 1px; background: var(--line); margin: 14px 6px; }

  /* ── sub toolbar ── */
  .sub { position: fixed; top: var(--top); left: 0; right: var(--side); height: var(--sub); display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); z-index: 4; }
  .sb { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
  /* narrower windows: sub-toolbar buttons become icons (their titles stay as tooltips) */
  @media (max-width: 1250px) { .sb { padding: 0 9px; font-size: 0; gap: 0; } .sb svg { width: 18px; height: 18px; } .zoom input[type=range] { width: 110px; } }
  @media (max-width: 900px) { .tb { min-width: 52px; padding: 0 6px; } .zoom input[type=range] { width: 80px; } .bgctl input[type=range] { width: 56px; } }
  .sb svg { width: 16px; height: 16px; }
  .sb:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
  .sb.on { color: var(--accent-ink); background: var(--accent); }
  .sub .grow { flex: 1; }
  .zoom { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .zoom input[type=range] { width: 150px; }
  .zoom .pct { width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .bgctl { display: flex; align-items: center; gap: 6px; margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--line); }
  .bgctl input[type=range] { width: 84px; }
  .bgctl input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, #000, #fff); box-shadow: inset 0 0 0 1px var(--line2); }
  .bgctl input[type=range]::-moz-range-track { background: linear-gradient(90deg, #000, #fff); }
  .bgctl.auto input[type=range] { opacity: .35; }
  .bgsw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line2); flex: none; }
  input[type=range]:disabled { cursor: default; opacity: .35; }
  .bwrange::-webkit-slider-runnable-track { background: linear-gradient(90deg, #000, #fff) !important; box-shadow: inset 0 0 0 1px var(--line2); }
  .bwrange::-moz-range-track { background: linear-gradient(90deg, #000, #fff) !important; }
  .iconbtn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .iconbtn:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
  .iconbtn.on { color: var(--accent); background: var(--accent-soft); }
  .iconbtn svg { width: 16px; height: 16px; }

  /* ── stage ── */
  .stage { position: fixed; top: calc(var(--top) + var(--sub)); left: 0; right: var(--side); bottom: 26px; background: var(--stage); overflow: hidden;
    background-image: radial-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px); background-size: 22px 22px; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .status { position: fixed; left: 0; right: var(--side); bottom: 0; height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px;
    background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .status b { color: var(--text); font-weight: 600; }
  .textedit { position: absolute; z-index: 3; background: transparent; border: 1px dashed var(--accent); outline: none; color: #fff; padding: 0; margin: 0;
    resize: none; overflow: hidden; white-space: pre; line-height: 1.15; min-width: 20px; }

  /* ── side panel ── */
  .side { position: fixed; top: var(--top); right: 0; bottom: 0; width: var(--side); background: linear-gradient(#16161b, #111115); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 4; }
  .side .scroll { flex: 1; overflow-y: auto; padding: 18px 18px 10px; }
  .side h2 { margin: 0 0 14px; font-size: 18px; font-weight: 300; letter-spacing: .01em; }
  .side h3 { margin: 18px 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hr { height: 1px; background: var(--line); margin: 16px 0; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tile { aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); position: relative;
    transition: border-color .15s, background .15s, transform .1s; }
  .tile:hover { border-color: var(--line2); background: var(--panel3); }
  .tile.on { border-color: var(--accent); background: linear-gradient(180deg, rgba(250, 204, 21, .18), rgba(250, 204, 21, .05)); }
  .tile svg { width: 30px; height: 30px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 6px; }
  .row label { color: var(--muted); }
  .num { width: 78px; height: 30px; text-align: right; padding: 0 9px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--line); outline: none; }
  .num:focus { border-color: var(--accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), var(--line2) var(--p, 50%)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), var(--line2) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px #000a; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px #000a; }
  .toggle { display: flex; align-items: center; gap: 10px; margin: 8px 0; cursor: pointer; color: var(--text); }
  .toggle input { display: none; }
  .toggle i { width: 36px; height: 20px; border-radius: 10px; background: var(--line2); position: relative; transition: background .15s; flex: none; }
  .toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle input:checked + i { background: var(--accent); }
  .toggle input:checked + i::after { transform: translateX(16px); background: var(--accent-ink); }
  .btn { height: 34px; padding: 0 14px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { border-color: var(--line2); background: var(--panel3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn svg { width: 16px; height: 16px; }
  .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .btns4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btns4 .btn { padding: 0; height: 42px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair .num { width: 100%; }
  .field label { display: block; color: var(--muted); margin-bottom: 5px; font-size: 12px; }
  select.sel { width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); outline: none; }
  .check { display: flex; align-items: center; gap: 9px; margin: 9px 0; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .hint { color: var(--dim); font-size: 11.5px; margin-top: 8px; }

  /* colours (bottom of panel) */
  .colors { border-top: 1px solid var(--line); padding: 14px 18px 16px; background: rgba(0, 0, 0, .18); }
  .cur { display: grid; grid-template-columns: 1fr 44px 44px; gap: 6px; margin-bottom: 10px; }
  .swatch { height: 40px; border-radius: 8px; border: 1px solid var(--line2); position: relative; overflow: hidden;
    background-image: linear-gradient(45deg, #444 25%, transparent 25%, transparent 75%, #444 75%), linear-gradient(45deg, #444 25%, transparent 25%, transparent 75%, #444 75%);
    background-size: 10px 10px; background-position: 0 0, 5px 5px; background-color: #666; cursor: pointer; }
  .swatch i { position: absolute; inset: 0; }
  .swatch span { position: absolute; left: 10px; bottom: 6px; font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px #000; mix-blend-mode: normal; }
  .pal { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
  .pal button { aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(255, 255, 255, .08); }
  .pal button:hover { transform: scale(1.12); box-shadow: 0 2px 8px #000a; position: relative; z-index: 1; }
  .recent { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .recent button { aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(255, 255, 255, .08); }
  .recent .empty { background: transparent; border-style: dashed; pointer-events: none; }

  /* history */
  .hist { display: flex; flex-direction: column; gap: 3px; }
  .hist button { text-align: left; padding: 8px 10px; border-radius: 7px; background: var(--panel2); border: 1px solid transparent; color: var(--muted); display: flex; justify-content: space-between; }
  .hist button.cur { color: var(--text); border-color: var(--accent); }
  .hist button.future { opacity: .45; }

  /* menu + dialogs */
  .menu-pop { position: fixed; top: calc(var(--top) - 4px); left: 8px; width: 260px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; padding: 6px;
    box-shadow: 0 18px 50px #000c; z-index: 20; display: none; }
  .menu-pop.open { display: block; }
  .menu-pop button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text); text-align: left; }
  .menu-pop button:hover { background: rgba(255, 255, 255, .06); }
  .menu-pop button svg { width: 17px; height: 17px; color: var(--muted); }
  .menu-pop kbd { margin-left: auto; color: var(--dim); font: 11px "Segoe UI", sans-serif; }
  .menu-pop .msep { height: 1px; background: var(--line); margin: 5px 6px; }
  .more-pop { left: auto; right: calc(var(--side) + 8px); top: calc(var(--top) + var(--sub) - 4px); }
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 30; }
  .modal.open { display: flex; }
  .dialog { width: min(440px, 92vw); background: linear-gradient(#1b1b21, #131318); border: 1px solid var(--line2); border-radius: 16px; padding: 22px; box-shadow: 0 30px 80px #000; }
  .dialog h2 { margin: 0 0 4px; font-size: 20px; font-weight: 300; }
  .dialog p { margin: 0 0 16px; color: var(--muted); }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .presets button { padding: 10px 6px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); text-align: center; }
  .presets button:hover, .presets button.on { border-color: var(--accent); }
  .presets b { display: block; font-weight: 600; }
  .presets small { color: var(--muted); }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--panel3); border: 1px solid var(--line2); color: var(--text);
    padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px #000a; opacity: 0; transition: .2s; pointer-events: none; z-index: 40; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .dropzone { position: fixed; inset: 0; border: 3px dashed var(--accent); background: rgba(250, 204, 21, .06); z-index: 25; display: none; pointer-events: none; }
  .dropzone.show { display: block; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<!-- Image Editor — original code. Paint 3D-style workflow (top categories, right properties panel), our own dark design. -->
<header class="top">
  <button class="tb menu" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9h18"/></svg><span>Menu</span></button>
  <div class="cats" id="cats">
    <button class="tb" data-cat="brushes" title="Brushes (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5-8.5 8.5-5-5z"/><path d="M6 13c-2 1-2.5 3-2.5 6.5C7 19.5 9 19 10 17"/></svg><span>Brushes</span></button>
    <button class="tb" data-cat="shapes" title="2D shapes (U)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="10" width="10" height="10" rx="1.5"/><circle cx="15.5" cy="8.5" r="5"/></svg><span>2D shapes</span></button>
    <button class="tb" data-cat="text" title="Text (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg><span>Text</span></button>
    <button class="tb" data-cat="effects" title="Effects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Effects</span></button>
    <button class="tb" data-cat="canvas" title="Canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 3v14h14"/><path d="M3 7h14v14"/></svg><span>Canvas</span></button>
    <button class="tb" data-cat="card" title="Export pixel art to a Tower Cards card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="15" cy="7.5" r="1.8" fill="currentColor" stroke="none"/><path d="M8 15h8M8 18h5"/></svg><span>Card art</span></button>
  </div>
  <div class="tright">
    <button class="tb" id="pasteBtn" title="Paste (Ctrl+V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3.5h6V5"/></svg><span>Paste</span></button>
    <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg><span>Undo</span></button>
    <button class="tb" data-cat="history" title="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></button>
    <button class="tb" id="redoBtn" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2" transform="translate(0 -6)"/></svg><span>Redo</span></button>
  </div>
</header>

<nav class="sub">
  <button class="sb" data-tool="select" title="Select (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>Select</button>
  <button class="sb" data-tool="crop" title="Crop (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg>Crop</button>
  <button class="sb" data-tool="magic" title="Magic select (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L15 9"/><path d="M15 3v3M18.5 4.5l-2 2M21 9h-3M12 6.5l-2-2"/></svg>Magic select</button>
  <button class="sb" data-tool="picker" title="Eyedropper (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M14 4l6 6-2 2-6-6z"/><path d="M13 7l-8.5 8.5L4 20l4.5-.5L17 11"/></svg>Eyedropper</button>
  <div class="grow"></div>
  <div class="zoom">
    <button class="iconbtn" id="zoomOut" title="Zoom out (-)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <input type="range" id="zoomRange" min="0" max="1000" step="1">
    <button class="iconbtn" id="zoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
    <span class="pct" id="zoomPct">100%</span>
  </div>
  <div class="bgctl" title="Background behind transparent pixels (view only, not saved)">
    <span class="bgsw" id="bgSwatch"></span>
    <input type="range" id="bgRange" min="0" max="100" step="1" aria-label="Background: black to white">
    <button class="iconbtn" id="bgAutoBtn" title="Auto: inverse of the image's average colour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
  </div>
  <button class="iconbtn" id="moreBtn" title="View options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
</nav>

<main class="stage" id="stage"><canvas id="view"></canvas></main>
<footer class="status"><span id="stSize"></span><span id="stPos"></span><span id="stSel"></span><span style="margin-left:auto" id="stTool"></span></footer>

<aside class="side">
  <div class="scroll" id="panel"></div>
  <div class="colors" id="colorsBox">
    <div class="cur">
      <div class="swatch" id="curSwatch" title="Custom colour"><i id="curFill"></i><span id="curHex"></span></div>
      <button class="btn" id="pickBtn" title="Eyedropper (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M14 4l6 6-2 2-6-6z"/><path d="M13 7l-8.5 8.5L4 20l4.5-.5L17 11"/></svg></button>
      <button class="btn" id="hexBtn" title="Type a hex colour">#</button>
    </div>
    <div class="pal" id="pal"></div>
    <div class="recent" id="recent"></div>
    <input type="color" id="colorInput" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0">
  </div>
</aside>

<div class="menu-pop" id="menuPop">
  <button data-act="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>New<kbd>Ctrl+N</kbd></button>
  <button data-act="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>Open<kbd>Ctrl+O</kbd></button>
  <button data-act="insert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/></svg>Insert image</button>
