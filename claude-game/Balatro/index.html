<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Balatro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100vh; overflow: hidden;
      background: #0a0a0f;
      font-family: 'Courier New', Courier, monospace;
      color: #c8b87a;
    }

    /* ── Canvas (love.js renders here) ── */
    #canvas {
      display: none;
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
    }

    /* ── Splash overlay ── */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      background: #0a0a0f;
      transition: opacity 0.6s;
      z-index: 10;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .logo {
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 900; letter-spacing: clamp(8px, 2vw, 18px);
      color: #f5d060;
      text-shadow: 0 0 80px rgba(245,208,96,.5), 0 0 30px rgba(245,208,96,.35);
      margin-bottom: 8px;
    }
    .sub {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: #5a4a20; margin-bottom: 48px;
    }

    /* ── Progress bar ── */
    #prog-wrap { margin-bottom: 36px; }
    .bar-bg {
      width: 300px; height: 4px; background: #1a160a;
      border-radius: 2px; overflow: hidden;
      border: 1px solid rgba(245,208,96,.12);
    }
    #bar { height: 100%; width: 0%; background: #f5d060; transition: width .3s; }
    #status { font-size: 11px; color: #5a5030; margin-top: 10px; letter-spacing: 1px; }

    /* ── Launch button ── */
    #btn-play {
      display: inline-block; margin-top: 4px;
      background: rgba(245,208,96,.14);
      border: 1px solid rgba(245,208,96,.4);
      color: #f5d060; padding: 13px 40px; border-radius: 8px;
      font-family: inherit; font-size: 13px; letter-spacing: 2px;
      cursor: pointer; transition: background .15s, transform .1s;
    }
    #btn-play:hover { background: rgba(245,208,96,.24); transform: scale(1.03); }
    #btn-play:active { transform: scale(0.98); }
    #btn-play:disabled { opacity: .4; cursor: default; transform: none; }

    /* ── Error / feedback ── */
    #feedback {
      margin-top: 18px; font-size: 11px; min-height: 18px;
      max-width: 360px; line-height: 1.6;
    }
    #feedback.err { color: #c06050; }
    #feedback.ok  { color: #5fba6f; }

    /* ── Back button ── */
    #btn-back {
      position: fixed; top: 16px; left: 16px; z-index: 100;
      background: rgba(0,0,0,.6); border: 1px solid rgba(245,208,96,.25);
      color: #c8b87a; padding: 7px 14px; border-radius: 6px;
      font-family: inherit; font-size: 11px; cursor: pointer;
      text-decoration: none; display: inline-block;
      transition: border-color .15s, background .15s;
    }
    #btn-back:hover { border-color: rgba(245,208,96,.5); background: rgba(245,208,96,.08); }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="return false;"></canvas>

  <a id="btn-back" href="/claude-game/index.html">← Back to Arena</a>

  <div id="overlay">
    <div class="logo">BALATRO</div>
    <div class="sub">Poker is a life skill</div>

    <div id="prog-wrap">
      <div class="bar-bg"><div id="bar"></div></div>
      <div id="status">Click to start</div>
    </div>

    <button id="btn-play">▶ Play Balatro</button>
    <div id="feedback"></div>
  </div>

  <script>
  (function () {
    'use strict';

    const overlay  = document.getElementById('overlay');
    const canvas   = document.getElementById('canvas');
    const barEl    = document.getElementById('bar');
    const statusEl = document.getElementById('status');
    const feedEl   = document.getElementById('feedback');
    const btnPlay  = document.getElementById('btn-play');

    function setFeedback(msg, cls) { feedEl.textContent = msg; feedEl.className = cls || ''; }
    function setStatus(text) { statusEl.textContent = text; }
    function setBar(pct) { barEl.style.width = Math.min(100, pct) + '%'; }

    function hideOverlay() {
      canvas.style.display = 'block';
      overlay.classList.add('hidden');
      setTimeout(() => { overlay.style.display = 'none'; }, 700);
    }

    function launchLoveJS() {
      btnPlay.disabled = true;
      setStatus('Initializing…'); setBar(5);

      window.Module = {
        arguments: ['game.love'],
        canvas: canvas,
        print: console.log,
        printErr: console.warn,
        setStatus(text) {
          if (!text) { hideOverlay(); return; }
          const m = text.match(/\((\d+)\/(\d+)\)/);
          if (m) {
            const pct = 10 + (+m[1] / +m[2]) * 85;
            setBar(pct);
            setStatus('Loading… ' + m[1] + ' / ' + m[2]);
          } else {
            setStatus(text);
          }
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          if (!left) Module.setStatus('');
          else Module.setStatus('Loading (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        }
      };

      // Animate the status text while the JS file downloads (can take 5–15s)
      const loadMsgs = [
        'Downloading love.js runtime… (388 KB)',
        'Downloading love.js runtime… this may take a moment',
        'Almost there… waiting for runtime',
      ];
      let msgIdx = 0;
      const msgTimer = setInterval(() => {
        msgIdx = (msgIdx + 1) % loadMsgs.length;
        setStatus(loadMsgs[msgIdx]);
      }, 4000);

      setStatus(loadMsgs[0]); setBar(8);
      const s = document.createElement('script');
      s.src = 'love.js/love.js';
      s.onload  = () => clearInterval(msgTimer); // Module.setStatus takes over
      s.onerror = () => {
        clearInterval(msgTimer);
        btnPlay.disabled = false;
        setStatus('Click to start');
        setFeedback('Failed to load love.js runtime. Make sure love.js/love.js is present on the server.', 'err');
      };
      document.body.appendChild(s);
    }

    btnPlay.addEventListener('click', function () {
      if (!window.WebAssembly) {
        setFeedback('WebAssembly is not supported in this browser.', 'err');
        return;
      }
      setStatus('Checking game bundle…'); setBar(3);
      setFeedback('');

      fetch('game.love', { method: 'HEAD' })
        .then(r => { if (!r.ok) throw new Error('game.love not found on server (HTTP ' + r.status + ')'); })
        .then(() => launchLoveJS())
        .catch(err => {
          setStatus('Click to start');
          setFeedback(err.message, 'err');
        });
    });
  })();
  </script>
</body>
</html>
