<!doctype html><meta charset="utf-8"><body><script type="module">
import { store, mediaRuntime, makeClip, makeTrack, newProject, defaultAudioFx } from '../js/state.js';
import { createAudioEngine, VOICE_FILTERS, AUDIO_PRESETS } from '../js/audio.js';
const SR = 48000, LEN = 3 * SR;
const buf = new AudioBuffer({ length: LEN, numberOfChannels: 2, sampleRate: SR });
{ const L = buf.getChannelData(0), R = buf.getChannelData(1); let ph = 0;
  for (let i = 0; i < LEN; i++) { const t = i / SR; const f = 140 + 20 * Math.sin(2*Math.PI*5*t) + 30*Math.sin(2*Math.PI*0.7*t);
    ph += f / SR; ph -= Math.floor(ph);
    const saw = 2*ph - 1; const env = 0.5 + 0.5*Math.sin(2*Math.PI*3*t); const v = 0.35 * saw * env + 0.02*(Math.random()*2-1);
    L[i] = v; R[i] = v; } }
mediaRuntime.set('m1', { audioBuffer: buf, pitchCache: new Map() });
const p = newProject(); const tr = p.tracks.find(t => t.kind === 'audio');
p.media.push({ id: 'm1', name: 'v', kind: 'audio', duration: 3, hasAudio: true });
const clip = makeClip({ type: 'audio', mediaId: 'm1', trackId: tr.id, start: 0, duration: 3 });
p.clips.push(clip); store.project = p;
const audio = createAudioEngine({ store, mediaRuntime });
function stats(b) {
  const L = b.getChannelData(0), R = b.getChannelData(b.numberOfChannels - 1);
  let e = 0, pk = 0, fin = true, d = 0, lr = 0;
  for (let i = 0; i < L.length; i++) { const v = L[i]; if (!Number.isFinite(v) || !Number.isFinite(R[i])) fin = false;
    e += v*v + R[i]*R[i]; pk = Math.max(pk, Math.abs(v), Math.abs(R[i])); if (i) d += (v - L[i-1])**2; lr += (v - R[i])**2; }
  return { len: b.length, fin, rms: Math.sqrt(e / (2*L.length)), peak: pk, bright: Math.sqrt(d / (e/2 + 1e-12)), lrDiff: Math.sqrt(lr / L.length) };
}
function diff(a, b) { const x = a.getChannelData(0), y = b.getChannelData(0); let e = 0; for (let i = 0; i < x.length; i++) e += (x[i]-y[i])**2; return Math.sqrt(e / x.length); }
async function run(audioPatch, speed = 1) {
  clip.audio = { ...clip.audio, voice: 'none', voiceMix: 1, fx: defaultAudioFx(), ...audioPatch };
  clip.speed = speed; clip.duration = 3 / speed;
  return audio.renderMix({ start: 0, end: 3, sampleRate: SR, channels: 2 });
}
window.runAll = async () => {
  const out = [];
  const dry = await run({}); const ds = stats(dry); out.push({ name: 'dry', ...ds });
  const rec = async (name, b) => out.push({ name, ...stats(b), diff: diff(b, dry) });
  for (const v of VOICE_FILTERS) await rec('voice:' + v.id, await run({ voice: v.id }));
  await rec('voice:robot@0.5', await run({ voice: 'robot', voiceMix: 0.5 }));
  const fxCases = { reverb: { reverb: 0.5 }, reverbBig: { reverb: 0.5, reverbSize: 1 }, echo: { echo: 0.5 }, crush: { crush: 1, crushBits: 4, crushRate: 4000 },
    crushHalf: { crush: 0.5 }, lowpass: { lowpass: 0.7 }, highpass: { highpass: 800 }, bass: { bass: 12 }, orbit: { orbit: 1, orbitSpeed: 1 } };
  for (const [k, f] of Object.entries(fxCases)) await rec('fx:' + k, await run({ fx: { ...defaultAudioFx(), ...f } }));
  for (const pr of AUDIO_PRESETS) { const r = pr.apply(clip.audio); const { clipSpeed, ...a } = r; await rec('preset:' + pr.id, await run(a, clipSpeed || 1)); }
  // determinism: same render twice
  const a1 = await run({ voice: 'alien', fx: { ...defaultAudioFx(), reverb: 0.4, orbit: 1 } }), a2 = await run({ voice: 'alien', fx: { ...defaultAudioFx(), reverb: 0.4, orbit: 1 } });
  out.push({ name: 'determinism', diff: diff(a1, a2) });
  return out;
};
window.liveTest = async () => {
  clip.audio = { ...clip.audio, voice: 'robot', fx: { ...defaultAudioFx(), crush: 1, reverb: 0.3, orbit: 1 } }; clip.speed = 1; clip.duration = 3;
  await audio.ctx.resume(); audio.play(0); let mx = 0;
  for (let i = 0; i < 20; i++) { await new Promise(r => setTimeout(r, 50)); const m = audio.meter(); mx = Math.max(mx, m.l, m.r); }
  clip.audio.voice = 'choir'; audio.refresh();
  for (let i = 0; i < 10; i++) { await new Promise(r => setTimeout(r, 50)); const m = audio.meter(); mx = Math.max(mx, m.l, m.r); }
  audio.stop(); return { mx, state: audio.ctx.state };
};
window.ready = true;
</script>
