<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222;color:#eee;font:11px sans-serif} .g{display:flex;flex-wrap:wrap;gap:4px;padding:4px} .c{width:240px} .c img{width:240px;height:135px;display:block} </style></head>
<body><div id="sheet" class="g"></div>
<script type="module">
import { createRenderer } from '../js/renderer.js';
const W = 640, H = 360;
function mk(label, hue) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, `hsl(${hue},70%,25%)`); gr.addColorStop(1, `hsl(${hue + 60},70%,70%)`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.5)'; for (let x = 0; x < W; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y < H; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = '#e02020'; g.beginPath(); g.arc(160, 180, 80, 0, 7); g.fill();
  g.fillStyle = '#20c040'; g.fillRect(300, 60, 120, 120);
  g.fillStyle = '#fff'; g.font = 'bold 120px sans-serif'; g.fillText(label, 300, 320);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, 20); g.fillStyle = '#ff0'; g.font = '16px sans-serif'; g.fillText('TOP ' + label, 10, 16);
  return c;
}
const imgs = { A: mk('A', 200), B: mk('B', 20) };
let list = [];
const store = { project: { settings: { width: W, height: H, background: '#000000' }, clips: [], materials: [] },
  renderListAt: () => list, getMedia: () => null, getMaterial: () => null, on() {}, off() {} };
const sources = { getFrame: c => c.type === 'adjustment' ? null : ({ el: imgs[c.img], width: W, height: H }), version: () => 1 };
const canvas = document.createElement('canvas'); canvas.width = 480; canvas.height = 270;
const renderer = createRenderer({ canvas, store, sources, mediaRuntime: new Map() });
const clip = (img, over = {}) => ({ id: img + Math.random(), type: 'image', img, start: 0, duration: 5, transform: {}, crop: {}, color: {}, filters: [], chroma: {}, blend: 'normal', ...over });
const sheet = document.getElementById('sheet');
const errs = [], quads = {};
function cell(label) {
  const e = renderer.gl.getError(); if (e) errs.push(label + ': glError ' + e);
  const d = document.createElement('div'); d.className = 'c';
  const im = document.createElement('img'); im.src = canvas.toDataURL(); d.append(im, label); sheet.append(d);
}
const bg = () => ({ clip: clip('B'), transition: null });
const L = (over) => ({ clip: clip('A', over), transition: null });
const adj = (over) => ({ clip: clip(null, { type: 'adjustment', ...over }), transition: null });
const M = (m) => ({ type: 'none', x: 0, y: 0, w: 0.5, h: 0.5, angle: 0, feather: 0.15, invert: false, ...m });
const G = (g) => ({ enabled: true, mode: 'linear', angle: 90, start: 0, end: 0.5, strength: 40, x: 0, y: 0, ...g });
const cases = [
  ['tile_2x2', [L({ filters: [{ type: 'tile_2x2', amount: 1 }] })]],
  ['tile_mirror', [L({ filters: [{ type: 'tile_mirror', amount: 1 }] })]],
  ['tile_2x2 amt .5', [L({ filters: [{ type: 'tile_2x2', amount: 0.5 }] })]],
  ['mask linear 30° f.3', [bg(), L({ mask: M({ type: 'linear', angle: 30, feather: 0.3 }) })]],
  ['mask radial w.6', [bg(), L({ mask: M({ type: 'radial', w: 0.6, feather: 0.4 }) })]],
  ['mask rect 20° off', [bg(), L({ mask: M({ type: 'rect', x: 0.2, y: -0.1, w: 0.4, h: 0.5, angle: 20, feather: 0.1 }) })]],
  ['mask ellipse invert', [bg(), L({ mask: M({ type: 'ellipse', w: 0.7, h: 0.6, invert: true }) })]],
  ['mask moves w/ clip', [bg(), L({ transform: { scale: 0.5, x: 120, y: 40, rotation: 25 }, mask: M({ type: 'ellipse', w: 0.8, h: 0.8, feather: 0.05 }) })]],
  ['adj gray + ellipse mask', [bg(), adj({ color: { grayscale: true }, mask: M({ type: 'ellipse', w: 0.5, h: 0.6 }) })]],
  ['gradblur linear 90 (top blur)', [L({ gradBlur: G({}) })]],
  ['gradblur band start1 end.3', [L({ gradBlur: G({ mode: 'band', start: 1, end: 0.3, strength: 30 }) })]],
  ['gradblur radial start1 end.2', [L({ gradBlur: G({ mode: 'radial', start: 1, end: 0.2, strength: 40 }) })]],
  ['gradblur linear 0°', [L({ gradBlur: G({ angle: 0, start: 0, end: 1, strength: 60 }) })]],
  ['rotY 40', [bg(), L({ transform: { scale: 0.7, rotY: 40 } })]],
  ['rotX 45', [bg(), L({ transform: { scale: 0.7, rotX: 45 } })]],
  ['rotY -50 persp 400', [bg(), L({ transform: { scale: 0.7, rotY: -50, perspective: 400 } })]],
  ['rotX30 rotY30 rot20 move', [bg(), L({ transform: { scale: 0.6, rotX: 30, rotY: 30, rotation: 20, x: 100, y: 30 } })]],
  ['rotY 120 (backface)', [bg(), L({ transform: { scale: 0.7, rotY: 120 } })]],
  ['rotX 89 persp 0 (extreme)', [bg(), L({ transform: { scale: 1, rotX: 89, perspective: 0 } })]],
  ['huge values', [bg(), L({ color: { brightness: 1000, contrast: -5000, blur: 1e6, posterize: 1, exposure: 1e5, noise: 1e4, vignette: 900, sharpen: 1e4 }, gradBlur: G({ strength: 1e7 }), mask: M({ type: 'rect', w: -3, h: 0, feather: 1e6 }), filters: [{ type: 'shake', amount: 1e9 }], crop: { l: 5, r: -2 } })]],
  ['huge color only', [bg(), L({ transform: { scale: 0.6 }, color: { brightness: 1000, contrast: -5000, blur: 1e6, posterize: 1, exposure: 1e5, noise: 1e4, vignette: 900, sharpen: 1e4, gamma: 1e4, clarity: 1e5, fade: 1e4 } })]],
  ['negative', [bg(), L({ color: { saturation: -400, gamma: -900, vibrance: 1e3 }, transform: { scale: -0.5, perspective: -50, rotY: 30 } })]],
];
for (const [n, l] of cases) { list = l; renderer.render(1.3); cell(n); const c = l[l.length - 1].clip; quads[n] = renderer.getClipQuad(c).map(p => [Math.round(p.x), Math.round(p.y)]); }
window.__done = { errs, quads };
</script></body></html>
