<!doctype html><html data-theme="filmora"><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/editor.css"><link rel="stylesheet" href="../css/timeline.css">
<style>#timelinePanel{position:absolute;left:0;top:0;width:1280px;height:420px}</style></head>
<body><section id="timelinePanel" class="panel"><div id="timeline"></div></section>
<script type="module">
import { store, mediaRuntime, makeClip, makeTrack } from '../js/state.js';
import { ops } from '../js/ops.js';
import { createTimeline } from '../js/timeline.js';
const p = store.project;
const v2 = makeTrack('video','Video 2'); p.tracks.unshift(v2);
const [V2,V1,A1] = p.tracks;
p.media.push({id:'m1',name:'beach.mp4',kind:'video',duration:20,width:1920,height:1080,hasAudio:false});
p.clips.push(makeClip({id:'c1',trackId:V1.id,type:'video',mediaId:'m1',name:'A',start:0,duration:5}));
p.clips.push(makeClip({id:'c2',trackId:V1.id,type:'video',mediaId:'m1',name:'B',start:5,duration:4,in:5,transitionIn:{type:'dissolve',duration:1}}));
p.clips.push(makeClip({id:'c3',trackId:V1.id,type:'video',mediaId:'m1',name:'C',start:9,duration:4,in:9}));
p.clips.push(makeClip({id:'c4',trackId:V2.id,type:'image',name:'img',start:2,duration:3,transitionOut:{type:'wipe_left',duration:1}}));
store.setPlayhead(3);
window.tl = createTimeline({ root: document.getElementById('timeline'), store, mediaRuntime, ops });
window.store = store; window.ops = ops; window.__ready = true;
</script></body></html>
