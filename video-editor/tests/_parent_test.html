<script>
window.ffCalls = [];
window.loadSharedFFmpeg = async () => { const fs = {}; return {
  writeFile: async (n, d) => { fs[n] = d; ffCalls.push(['write', n, d.length]); },
  exec: async a => { ffCalls.push(['exec', a.join(' ')]); window._sharedFFmpegProgressCb?.(0.5); fs[a.at(-1)] = fs[a[1]]; return 0; },
  readFile: async n => fs[n], deleteFile: async n => { delete fs[n]; }, terminate() { ffCalls.push(['terminate']); } }; };
</script>
